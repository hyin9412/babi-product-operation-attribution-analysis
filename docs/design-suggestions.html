<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计建议修改点</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f7; color: #1d1d1f; padding: 32px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e8e8ed; font-size: 14px; }
  th { background: #f9f9fb; font-weight: 600; color: #6e6e73; white-space: nowrap; }
  td { color: #1d1d1f; vertical-align: top; line-height: 1.6; }
  tr:last-child td { border-bottom: none; }
  .col-no { width: 60px; text-align: center; color: #86868b; }
  .col-page { width: 140px; }
  .col-issue { min-width: 280px; }
  .col-suggestion { min-width: 200px; }
  .col-confirm { width: 160px; }
</style>
</head>
<body>
<h1>设计建议修改点</h1>
<table>
  <thead>
    <tr>
      <th class="col-no">序号</th>
      <th class="col-page">页面/模块</th>
      <th class="col-issue">问题描述</th>
      <th class="col-suggestion">建议处理</th>
      <th class="col-confirm">产品需确认</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="col-no">1</td>
      <td>计费项收支</td>
      <td>计费项收支，表格里 对应的 成本利润率，增加 1月至今累计值列</td>
      <td>在「成本利润率」分组下新增「1月至今累计值」列</td>
      <td></td>
    </tr>
    <tr>
      <td class="col-no">2</td>
      <td>计费项收支</td>
      <td>将年度偏差改成 年度目标累计偏差</td>
      <td>将「年度偏差」列标题改为「年度目标累计偏差」</td>
      <td></td>
    </tr>
  </tbody>
</table>
</body>
</html>
